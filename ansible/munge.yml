---
- name: Prepare MUNGE key on controller
  hosts: controller
  become: true

  tasks:
    - name: Read MUNGE key from controller
      ansible.builtin.slurp:
        src: /etc/munge/munge.key
      register: munge_key
      no_log: true

    - name: Store MUNGE key for other hosts
      ansible.builtin.set_fact:
        munge_key_content: "{{ munge_key.content }}"
      no_log: true


- name: Distribute MUNGE key to compute nodes
  hosts: compute
  become: true

  tasks:
    - name: Install shared MUNGE key
      ansible.builtin.copy:
        content: "{{ hostvars['ctrl']['munge_key_content'] | b64decode }}"
        dest: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: "0400"
      no_log: true

    - name: Enable and start MUNGE
      ansible.builtin.systemd:
        name: munge
        enabled: true
        state: restarted
